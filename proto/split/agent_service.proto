syntax = "proto3";

package sentinel;

option go_package = "github.com/CoderXinNing/ebpf-system/proto/pb";

import "common.proto";
import "asset.proto";

// RegisterRequest 注册请求
message RegisterRequest {
    string agent_id = 1;
    string hostname = 2;
    string kernel_version = 3;
    string ip_address = 4;
    string agent_version = 5;
    string agent_group = 6;
    FrameworkInfo framework = 7;
    KernelInfo kernel_info = 8;
    string capability_level = 9;  // lsm/xdp/ebpf/cmdb
    int32 active_probes = 10;
}

message RegisterResponse {
    bool success = 1;
    string message = 2;
    string agent_token = 3;
}

message FrameworkInfo {
    bool bcc_available = 1;
    bool libbpf_available = 2;
    bool libbpf_core = 3;
    bool bpftrace_available = 4;
    bool clang_available = 5;
    bool llvm_available = 6;
    bool kernel_headers_available = 7;
    bool go_ebpf_available = 8;
}

message KernelInfo {
    string version = 1;
    string arch = 2;
    bool btf_enabled = 3;
}

message HeartbeatRequest {
    string agent_id = 1;
    int64 timestamp = 2;
    int32 active_probes = 3;
    string probe_details = 4;
    string baseline_state = 5;
    int64 baseline_remaining = 6;
}

message HeartbeatResponse {
    bool success = 1;
    repeated ProbeCommand commands = 2;
}

message ProbeEvent {
    string probe_id = 1;
    string probe_name = 2;
    int64 timestamp = 3;
    string event_type = 4;
    int32 pid = 5;
    string comm = 6;
    string filename = 7;
    string details = 8;
    uint64 correlation_key = 9;   // V3 星轨关联键
    string correlation_id = 10;   // local_correlation_id
}

message EventReport {
    string agent_id = 1;
    repeated ProbeEvent events = 2;
    string correlation_id = 3;  // 星轨激活时携带
}

message ShutdownRequest {
    string agent_id = 1;
}

message ShutdownResponse {
    bool success = 1;
}

message ProbeListRequest {
    string agent_id = 1;
}

message ProbeInfo {
    string name = 1;
    bool enabled = 2;
    bool remove = 3;
    string path = 4;
    string sha256 = 5;
}

message ProbeListResponse {
    bool success = 1;
    string message = 2;
    repeated ProbeInfo probes = 3;
    repeated string false_positive_features = 4;
}

// ========== 星轨激活 ==========

message MutationTrigger {
    string agent_id = 1;
    int32 pid = 2;
    string trigger_type = 3;
    string detail = 4;
    int64 timestamp = 5;
}

message StarActivation {
    string correlation_id = 1;
    string mode = 2;
    string reason = 3;
}

message StarActivationAck {
    bool mode_activated = 1;
    string error_message = 2;
}

// ========== 证书续期 ==========

message RenewCertRequest {
    string agent_id = 1;
    string csr = 2;  // 新的 CSR（PEM 格式）
}

message RenewCertResponse {
    bool success = 1;
    string message = 2;
    string agent_crt = 3;   // 新证书
    string ca_crt = 4;      // CA 证书
    string cert_serial = 5;
    string cert_expires = 6; // RFC3339
}

message ProbeStatusEntry {
    string name = 1;
    string status = 2;
    string reason = 3;
    int64 last_event_at = 4;
    int64 last_check_at = 5;
    bool selftest_ok = 6;
    int32 consecutive_failures = 7;
    int64 loaded_at = 8;
}

message ProbeStatusReport {
    string agent_id = 1;
    repeated ProbeStatusEntry entries = 2;
}

// ========== 动态规则下发（敏感路径等）==========

// 版本查询请求（Agent 定期拉，节省带宽）
message RulesVersionRequest {
    string agent_id = 1;
}

message RulesVersionResponse {
    bool success = 1;
    int64 version = 2;   // 0 = 无规则
    string sha256 = 3;   // canonical JSON 的 SHA256
    string message = 4;  // 错误信息
}

// 全量拉取请求
message RulesFullRequest {
    string agent_id = 1;
}

message RulesFullResponse {
    bool success = 1;
    int64 version = 2;
    string sha256 = 3;
    string content = 4;   // canonical JSON（规则内容）
    string signature = 5; // base64（CA 私钥签名）
    string message = 6;
}

service Sentinel {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc ReportEvents(EventReport) returns (ReportResponse);
    rpc GetProbeList(ProbeListRequest) returns (ProbeListResponse);
    rpc ReportShutdown(ShutdownRequest) returns (ShutdownResponse);

    rpc ReportMutation(MutationTrigger) returns (ReportResponse);
    rpc ActivateStarMode(StarActivation) returns (StarActivationAck);
    rpc RenewCert(RenewCertRequest) returns (RenewCertResponse);

    rpc ReportProcesses(ProcessReport) returns (ReportResponse);
    rpc ReportUsers(UserReport) returns (ReportResponse);
    rpc ReportSystemInfo(SystemReport) returns (ReportResponse);
    rpc ReportPackages(PackageReport) returns (ReportResponse);
    rpc ReportCronJobs(CronReport) returns (ReportResponse);
    rpc ReportServices(ServiceReport) returns (ReportResponse);
    rpc ReportWebComponents(WebComponentReport) returns (ReportResponse);
    rpc ReportHardware(HardwareReport) returns (ReportResponse);
    rpc ReportNetwork(NetworkReport) returns (ReportResponse);
    rpc ReportPerformance(PerfReport) returns (ReportResponse);
    rpc ReportAgentSelf(AgentSelfReport) returns (ReportResponse);

    rpc ReportProbeStatus(ProbeStatusReport) returns (ReportResponse);

    // 动态规则下发
    rpc GetRulesVersion(RulesVersionRequest) returns (RulesVersionResponse);
    rpc GetRulesFull(RulesFullRequest) returns (RulesFullResponse);
}
