syntax = "proto3";

package sentinel;

option go_package = "github.com/CoderXinNing/ebpf-system/proto/pb";

import "common.proto";

// ---- 进程资产 ----
message ProcessAsset {
    int32 pid = 1;
    int32 ppid = 2;
    string name = 3;
    string cmdline = 4;
    string exe_path = 5;
    string user = 6;
    string state = 7;
    repeated string listening_ports = 8;
    string start_time = 9;
}

message ProcessReport {
    string agent_id = 1;
    repeated ProcessAsset processes = 2;
}

// ---- 用户资产 ----
message UserAsset {
    string username = 1;
    int32 uid = 2;
    int32 gid = 3;
    string home = 4;
    string shell = 5;
    bool has_shell = 6;
    bool is_root = 7;
    bool is_disabled = 8;
    bool has_sudo = 9;
    string last_login = 10;
    string last_login_ip = 11;
}

message UserReport {
    string agent_id = 1;
    repeated UserAsset users = 2;
}

// ---- 系统信息 ----
message SystemAsset {
    OSAsset os = 1;
    CPUAsset cpu = 2;
    MemoryAsset memory = 3;
    repeated DiskAsset disks = 4;
    repeated NetworkAsset networks = 5;
    repeated string kernel_modules = 6;
    repeated ServiceAsset services = 7;
    string locale = 8;
    string timezone = 9;
}

message OSAsset {
    string name = 1;
    string version = 2;
    string kernel = 3;
}

message CPUAsset {
    string model = 1;
    int32 cores = 2;
}

message MemoryAsset {
    int32 total_mb = 1;
    int32 swap_total_mb = 2;
}

message DiskAsset {
    string mount_point = 1;
    string filesystem = 2;
    int32 total_mb = 3;
}

message NetworkAsset {
    string name = 1;
    string mac = 2;
    repeated string ips = 3;
}

message ServiceAsset {
    string name = 1;
    bool enabled = 2;
}

message SystemReport {
    string agent_id = 1;
    SystemAsset system = 2;
}

// ---- 软件包 ----
message PackageAsset {
    string name = 1;
    string version = 2;
    string manager = 3;
    int64 size_kb = 4;
}

message PackageReport {
    string agent_id = 1;
    repeated PackageAsset packages = 2;
    repeated JarPackageAsset jar_packages = 3;
    repeated PythonPackageAsset python_packages = 4;
    repeated NpmPackageAsset npm_packages = 5;
}

message JarPackageAsset {
    string name = 1;
    string type = 2;
    bool executable = 3;
    string version = 4;
    string path = 5;
}

message PythonPackageAsset {
    string name = 1;
    string version = 2;
    string path = 3;
    string scope = 4;
}

message NpmPackageAsset {
    string name = 1;
    string version = 2;
    string path = 3;
    string scope = 4;
}

// ---- 定时任务 ----
message CronAsset {
    string user = 1;
    string schedule = 2;
    string command = 3;
    string source = 4;
}

message CronReport {
    string agent_id = 1;
    repeated CronAsset crons = 2;
}

// ---- 服务识别 ----
message IdentifiedService {
    string name = 1;
    string version = 2;
    string type = 3;
    int32 pid = 4;
    string exe_path = 5;
    string config_path = 6;
    repeated string listen_port = 7;
}

message ServiceReport {
    string agent_id = 1;
    repeated IdentifiedService services = 2;
    repeated ServiceStatusAsset service_status = 3;
}

message ServiceStatusAsset {
    string name = 1;
    bool enabled = 2;
    string active = 3;
}

// ---- Web 组件 ----
message WebComponentAsset {
    string name = 1;
    string type = 2;
    string version = 3;
    string base_path = 4;
    string config_path = 5;
    int32 pid = 6;
}

message WebComponentReport {
    string agent_id = 1;
    repeated WebComponentAsset web_components = 2;
}

// ---- 硬件 ----
message HardwareAsset {
    string manufacturer = 1;
    string model = 2;
    string serial_number = 3;
    string uuid = 4;
    string boot_time = 5;
}

message HardwareReport {
    string agent_id = 1;
    HardwareAsset hardware = 2;
    repeated KernelModuleAsset kernel_modules = 3;
    repeated EnvVariableAsset env_variables = 4;
}

message KernelModuleAsset {
    string name = 1;
    string description = 2;
    string path = 3;
    string version = 4;
    string size = 5;
    int32 used_by = 6;
    repeated string parameters = 7;
}

message EnvVariableAsset {
    string name = 1;
    string value = 2;
    string type = 3;
    string user = 4;
}

// ---- 网络 ----
message NetworkGatewayAsset {
    string gateway = 1;
    repeated string dns = 2;
}

message NetworkDetailAsset {
    string name = 1;
    string mac = 2;
    repeated string ips = 3;
    string speed = 4;
    string duplex = 5;
    string mtu = 6;
}

message NetworkReport {
    string agent_id = 1;
    NetworkGatewayAsset gateway_dns = 2;
    repeated NetworkDetailAsset network_details = 3;
    repeated DiskUsageAsset disk_usages = 4;
}

message DiskUsageAsset {
    string mount_point = 1;
    int32 total_mb = 2;
    int32 used_mb = 3;
    string use_percent = 4;
}

// ---- 性能 ----
message PerfDataAsset {
    double cpu_percent = 1;
    double mem_percent = 2;
    int32 mem_used_mb = 3;
    int32 mem_total_mb = 4;
    repeated DiskPerfAsset disk_usage = 5;
}

message DiskPerfAsset {
    string mount_point = 1;
    int32 used_mb = 2;
    int32 total_mb = 3;
    string percent = 4;
}

message PerfReport {
    string agent_id = 1;
    PerfDataAsset perf = 2;
}

// ---- Agent 自信息 ----
message AgentSelfAsset {
    string install_path = 1;
    string config_path = 2;
    string log_path = 3;
    string run_user = 4;
    int32 run_pid = 5;
    string version = 6;
}

message AgentSelfReport {
    string agent_id = 1;
    AgentSelfAsset agent_self = 2;
}
