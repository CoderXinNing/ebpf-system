syntax = "proto3";

package sentinel;

option go_package = "github.com/CoderXinNing/ebpf-system/proto/pb";

message RegisterRequest {
    string agent_id = 1;
    string hostname = 2;
    string kernel_version = 3;
    string ip_address = 4;
    FrameworkInfo framework = 5;
    KernelInfo kernel_info = 6;
}

message RegisterResponse {
    bool success = 1;
    string message = 2;
    string agent_token = 3;
}

message FrameworkInfo {
    bool bcc_available = 1; string bcc_version = 2; bool python_bcc_available = 3;
    bool libbpf_available = 4; string libbpf_version = 5; bool libbpf_core = 6;
    bool bpftrace_available = 7; string bpftrace_version = 8;
    bool clang_available = 9; string clang_version = 10;
    bool llvm_available = 11; string llvm_version = 12;
    bool kernel_headers_available = 13; bool go_ebpf_available = 14;
}

message KernelInfo {
    string version = 1; string arch = 2; bool btf_enabled = 3;
}

message HeartbeatRequest {
    string agent_id = 1; string agent_token = 2;
    int64 timestamp = 3; int32 active_probes = 4;
}

message HeartbeatResponse {
    bool success = 1;
    repeated ProbeCommand commands = 2;
}

message ProbeCommand {
    enum CommandType {
        LOAD = 0; UNLOAD = 1; RELOAD = 3; INSTALL = 4;
    }
    CommandType type = 1;
    string probe_id = 2;
    string probe_name = 3;
    bytes probe_data = 4;      // probe.bpf.o 内容
    string probe_config = 5;   // probe.yaml 内容
}

message ProbeEvent {
    string probe_id = 1; string probe_name = 2;
    int64 timestamp = 3; string event_type = 4;
    int32 pid = 5; string comm = 6; string filename = 7; string details = 8;
}

message EventReport {
    string agent_id = 1; string agent_token = 2;
    repeated ProbeEvent events = 3;
}

service Sentinel {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);
    rpc ReportEvents(EventReport) returns (HeartbeatResponse);
}
