syntax = "proto3";

package sentinel;

option go_package = "github.com/CoderXinNing/ebpf-system/proto/pb";

// 框架支持信息
message FrameworkInfo {
    bool bcc_available = 1;
    string bcc_version = 2;
    bool python_bcc_available = 3;
    bool libbpf_available = 4;
    string libbpf_version = 5;
    bool libbpf_core = 6;
    bool bpftrace_available = 7;
    string bpftrace_version = 8;
    bool clang_available = 9;
    string clang_version = 10;
    bool llvm_available = 11;
    string llvm_version = 12;
    bool kernel_headers_available = 13;
    bool go_ebpf_available = 14;
}

// 内核特性信息
message KernelInfo {
    string version = 1;
    string arch = 2;
    bool btf_enabled = 3;
}

message RegisterRequest {
    string agent_id = 1;
    string hostname = 2;
    string kernel_version = 3;
    string ip_address = 4;
    FrameworkInfo framework = 5;
    KernelInfo kernel_info = 6;
}

message RegisterResponse {
    bool success = 1;
    string message = 2;
    string agent_token = 3;
}

message HeartbeatRequest {
    string agent_id = 1;
    string agent_token = 2;
    int64 timestamp = 3;
    int32 active_probes = 4;
    double cpu_percent = 5;
    int64 mem_bytes = 6;
}

message HeartbeatResponse {
    bool success = 1;
    repeated ProbeCommand commands = 2;
}

message ProbeCommand {
    enum CommandType {
        LOAD = 0;
        UNLOAD = 1;
        UPDATE = 2;
    }
    CommandType type = 1;
    string probe_id = 2;
    string probe_name = 3;
    bytes probe_data = 4;
    repeated string config_keys = 5;
    repeated string config_values = 6;
}

message ProbeStatus {
    string probe_id = 1;
    string probe_name = 2;
    enum Status {
        LOADED = 0;
        RUNNING = 1;
        ERROR = 2;
        UNLOADED = 3;
    }
    Status status = 3;
    string error_message = 4;
    int64 events_collected = 5;
}

message AlertEvent {
    string alert_id = 1;
    string probe_id = 2;
    string probe_name = 3;
    string severity = 4;
    string title = 5;
    string description = 6;
    int64 timestamp = 7;
    int32 pid = 8;
    string process_name = 9;
    repeated string metadata_keys = 10;
    repeated string metadata_values = 11;
}

message AgentReport {
    string agent_id = 1;
    string agent_token = 2;
    repeated ProbeStatus probe_statuses = 3;
    repeated AlertEvent alerts = 4;
}

service Sentinel {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);
    rpc Report(AgentReport) returns (HeartbeatResponse);
}
