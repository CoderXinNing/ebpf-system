syntax = "proto3";

package sentinel;

option go_package = "github.com/CoderXinNing/ebpf-system/proto/pb";

message RegisterRequest {
    string agent_id = 1; string hostname = 2; string kernel_version = 3; string ip_address = 4;
    string agent_version = 5;
    string agent_group = 6;
    FrameworkInfo framework = 7; KernelInfo kernel_info = 8;
}
message RegisterResponse { bool success = 1; string message = 2; string agent_token = 3; }
message FrameworkInfo {
    bool bcc_available = 1; bool libbpf_available = 2; bool libbpf_core = 3;
    bool bpftrace_available = 4; bool clang_available = 5; bool llvm_available = 6;
    bool kernel_headers_available = 7; bool go_ebpf_available = 8;
}
message KernelInfo { string version = 1; string arch = 2; bool btf_enabled = 3; }
message HeartbeatRequest { string agent_id = 1; string agent_token = 2; int64 timestamp = 3; int32 active_probes = 4; }
message HeartbeatResponse { bool success = 1; repeated ProbeCommand commands = 2; }
message ProbeCommand {
    enum CommandType { LOAD = 0; UNLOAD = 1; RELOAD = 3; INSTALL = 4; COLLECT = 5; }
    CommandType type = 1; string probe_id = 2; string probe_name = 3;
    bytes probe_data = 4; string probe_config = 5;
}
message ProbeEvent { string probe_id = 1; string probe_name = 2; int64 timestamp = 3; string event_type = 4; int32 pid = 5; string comm = 6; string filename = 7; string details = 8; }
message EventReport { string agent_id = 1; string agent_token = 2; repeated ProbeEvent events = 3; }

// 资产上报
message AssetReport {
    SystemAsset system = 5;
    HardwareAsset hardware = 10;
    repeated KernelModuleAsset kernel_modules = 11;
    repeated EnvVariableAsset env_variables = 12;
    repeated DiskUsageAsset disk_usages = 13;
    repeated NetworkDetailAsset network_details = 14;
    repeated ServiceStatusAsset service_status = 15;
    repeated JarPackageAsset jar_packages = 16;
    repeated PythonPackageAsset python_packages = 17;
    repeated NpmPackageAsset npm_packages = 18;
    AgentSelfAsset agent_self = 19;
    repeated CronAsset crons = 6;
    repeated PackageAsset packages = 7;
    repeated IdentifiedService services = 8;
    repeated WebComponentAsset web_components = 9;
    repeated UserAsset users = 4;
    string agent_id = 1; string agent_token = 2;
    repeated ProcessAsset processes = 3;
}
message SystemAsset {
    OSAsset os = 1;
    CPUAsset cpu = 2;
    MemoryAsset memory = 3;
    repeated DiskAsset disks = 4;
    repeated NetworkAsset networks = 5;
    repeated string kernel_modules = 6;
    repeated ServiceAsset services = 7;
    string locale = 8;
    string timezone = 9;
}
message OSAsset { string name = 1; string version = 2; string kernel = 3; }
message CPUAsset { string model = 1; int32 cores = 2; }
message MemoryAsset { int32 total_mb = 1; int32 swap_total_mb = 2; }
message DiskAsset { string mount_point = 1; string filesystem = 2; int32 total_mb = 3; }
message NetworkAsset { string name = 1; string mac = 2; repeated string ips = 3; }
message WebComponentAsset {
    string name = 1; string type = 2; string version = 3;
    string base_path = 4; string config_path = 5; int32 pid = 6;
}
message IdentifiedService {
    string name = 1; string version = 2; string type = 3;
    int32 pid = 4; string exe_path = 5; string config_path = 6;
    repeated string listen_port = 7;
}
message PackageAsset {
    string name = 1; string version = 2; string manager = 3;
}
message CronAsset {
    string user = 1; string schedule = 2; string command = 3; string source = 4;
}

message HardwareAsset {
    string manufacturer = 1; string model = 2; string serial_number = 3; string uuid = 4; string boot_time = 5;
}
message KernelModuleAsset {
    string name = 1; string description = 2; string path = 3; string version = 4;
    string size = 5; int32 used_by = 6; repeated string parameters = 7;
}
message EnvVariableAsset {
    string name = 1; string value = 2; string type = 3; string user = 4;
}
message DiskUsageAsset {
    string mount_point = 1; int32 total_mb = 2; int32 used_mb = 3; string use_percent = 4;
}
message NetworkDetailAsset {
    string name = 1; string mac = 2; repeated string ips = 3; string speed = 4; string duplex = 5; string mtu = 6;
}
message ServiceStatusAsset {
    string name = 1; bool enabled = 2; string active = 3;
}
message JarPackageAsset {
    string name = 1; string type = 2; bool executable = 3; string version = 4; string path = 5;
}
message PythonPackageAsset {
    string name = 1; string version = 2; string path = 3; string scope = 4;
}
message NpmPackageAsset {
    string name = 1; string version = 2; string path = 3; string scope = 4;
}
message AgentSelfAsset {
    string install_path = 1; string config_path = 2; string log_path = 3; string run_user = 4; int32 run_pid = 5; string version = 6;
}
message ServiceAsset { string name = 1; bool enabled = 2; }

message UserAsset {
    string username = 1; int32 uid = 2; int32 gid = 3;
    string home = 4; string shell = 5; bool has_shell = 6;
    bool is_root = 7; bool is_disabled = 8; bool has_sudo = 9;
    string last_login = 10; string last_login_ip = 11;
}

message ProcessAsset {
    int32 pid = 1; int32 ppid = 2; string name = 3; string cmdline = 4;
    string exe_path = 5; string user = 6; string state = 7;
    repeated string listening_ports = 8;
    string start_time = 9;
}

service Sentinel {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);
    rpc ReportEvents(EventReport) returns (HeartbeatResponse);
    rpc ReportAssets(AssetReport) returns (HeartbeatResponse);
}
