[server]
http_port = 8080
grpc_port = 50051

[database]
type = "postgres"
host = "localhost"
port = 5432
user = "sentinel"
# 口令不写在此处。优先环境变量 SENTINEL_DB_PASSWORD。
# 若确需写在配置文件，请将本文件权限设为 0600。
password = ""
dbname = "sentinel"
# libpq sslmode：disable / allow / prefer / require / verify-ca / verify-full
# 默认 prefer（能用加密就用）。生产建议 require 或更高。
sslmode = "prefer"

[tls]
cert_file = "certs/server.crt"
key_file = "certs/server.key"
ca_file = "certs/ca.crt"

# Agent Identity Model v1 强校验
# false = 过渡期（Token 认证）
# true  = 4 层强校验（L1 CA + L2 SAN + L3 公钥 + L4 撤销）
strict_mtls = true

# Agent 证书有效期（小时）
# 默认 8760 = 1 年
certificate_ttl_hours = 8760

[log]
level = "info"
format = "text"


[build]
# Go 编译器路径（留空则自动探测）
# 自动探测顺序：PATH → /usr/local/go/bin/go → /usr/bin/go → /snap/bin/go → ~/go/bin/go
go_path = ""

# 是否启用自动编译 Agent
# true  = 源码变化时自动重编
# false = 只用 server/static/ 下的预编译二进制
auto_build_agent = true
