[server]
http_port = 8080
grpc_port = 50051

[database]
type = "postgres"
host = "localhost"
port = 5432
user = "sentinel"
password = "sentinel_dev_2026"
dbname = "sentinel"

[tls]
cert_file = "certs/server.crt"
key_file = "certs/server.key"
ca_file = "certs/ca.crt"

# Agent Identity Model v1 强校验
# false = 过渡期（Token 认证）
# true  = 4 层强校验（L1 CA + L2 SAN + L3 公钥 + L4 撤销）
strict_mtls = false

# Agent 证书有效期（小时）
# 默认 8760 = 1 年
certificate_ttl_hours = 8760

[log]
level = "info"
format = "text"


[build]
# Go 编译器路径（留空则自动探测）
# 自动探测顺序：PATH → /usr/local/go/bin/go → /usr/bin/go → /snap/bin/go → ~/go/bin/go
go_path = ""

# 是否启用自动编译 Agent
# true  = 源码变化时自动重编
# false = 只用 server/static/ 下的预编译二进制
auto_build_agent = true
