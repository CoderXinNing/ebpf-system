[[rules]]
name = "反弹Shell检测"
severity = "CRITICAL"
description = "检测到反弹Shell特征"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "/dev/tcp|bash -i|nc -e|python -c.*socket|perl -e.*socket"

[[rules]]
name = "SSH暴力破解"
severity = "HIGH"
description = "短时间内大量SSH连接尝试"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "ssh.*root@|ssh.*admin@"

[rules.frequency]
count = 3
window_sec = 10

[[rules]]
name = "可疑定时任务"
severity = "MEDIUM"
description = "定时任务包含可疑命令"
source = "crontab"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "curl.*http|wget.*http|bash.*/tmp|python.*/tmp"


# ========== 命令执行检测 ==========

[[rules]]
name = "可疑命令执行"
severity = "HIGH"
description = "检测到常见渗透测试命令"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "uname -a|ifconfig|netstat -antp|cat /etc/shadow|cat /root/.bash_history|cat /etc/sudoers"

[[rules]]
name = "Base64编码命令"
severity = "HIGH"
description = "检测到Base64解码执行"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "base64.*-d|base64.*--decode"

[[rules]]
name = "WebShell特征"
severity = "CRITICAL"
description = "检测到WebShell常用函数"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "eval(|base64_decode|shell_exec|system(|passthru|assert("

# ========== 代理工具检测 ==========

[[rules]]
name = "已知代理工具"
severity = "CRITICAL"
description = "检测到常见代理/隧道工具"

[[rules.conditions]]
field = "comm"
op = "regex"
value = "frpc|nps|gost|ngrok|stowaway|chisel|suo5"

[[rules]]
name = "SSH隧道"
severity = "HIGH"
description = "检测到SSH端口转发"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "ssh.*-[DLR]\\s+\\d+"

# ========== 提权检测 ==========

[[rules]]
name = "可疑提权行为"
severity = "CRITICAL"
description = "检测到可能的内核提权行为"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "sudo -l|sudo su|su root|chmod +s|chmod 4777|python.*cap_setuid"

[[rules]]
name = "容器逃逸特征"
severity = "CRITICAL"
description = "检测到容器逃逸相关命令"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "nsenter|unshare|capsh --decode|mount /dev"

# ========== 下载执行 ==========

[[rules]]
name = "远程下载执行"
severity = "HIGH"
description = "检测到远程下载并执行"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "curl.*\\|.*sh|wget.*\\|.*sh|curl.*-o /tmp|wget.*-O /tmp"

# ========== 文件操作 ==========

[[rules]]
name = "敏感文件访问"
severity = "MEDIUM"
description = "访问敏感系统文件"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "cat /etc/shadow|cat /root/.bash_history|cat /etc/sudoers|cat /etc/crontab"

# ========== 信息收集 ==========

[[rules]]
name = "系统信息收集"
severity = "MEDIUM"
description = "收集系统信息"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "uname -a|cat /etc/os-release|cat /proc/version|hostname -f|ip addr|ifconfig -a"

[[rules]]
name = "网络信息收集"
severity = "MEDIUM"
description = "收集网络拓扑信息"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "netstat -antp|ss -antp|arp -a|route -n|traceroute"

# ========== 横向移动 ==========

[[rules]]
name = "SSH横向移动"
severity = "HIGH"
description = "尝试SSH连接其他主机"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "ssh (root|admin|user)@[0-9]+\\."

[[rules]]
name = "内网探测"
severity = "HIGH"
description = "内网存活探测"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "nmap|masscan|fping|for ip in.*ping"

# ========== 持久化 ==========

[[rules]]
name = "计划任务持久化"
severity = "CRITICAL"
description = "创建计划任务后门"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "crontab -e|echo.*>> /etc/crontab|schtasks /create"

[[rules]]
name = "SSH后门"
severity = "CRITICAL"
description = "写入SSH公钥"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "ssh-keygen|>>.*authorized_keys|mkdir.*\\.ssh"

# ========== 数据窃取 ==========

[[rules]]
name = "敏感数据打包"
severity = "HIGH"
description = "打包敏感文件"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "tar.*/etc/passwd|tar.*/etc/shadow|tar.*/var/www|zip.*/etc|gzip.*/etc"

[[rules]]
name = "数据外传"
severity = "CRITICAL"
description = "向外部传输数据"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "curl.*-F.*@|scp.*root@|rsync.*[0-9]+\\."

# ========== 权限维持 ==========

[[rules]]
name = "SUID提权"
severity = "CRITICAL"
description = "设置SUID权限"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "chmod u\\+s|chmod 4755|chmod 4777"

[[rules]]
name = "添加特权用户"
severity = "CRITICAL"
description = "添加特权账户"

[[rules.conditions]]
field = "cmdline"
op = "regex"
value = "useradd.*-o.*-u 0|adduser.*sudo|usermod.*-aG sudo"
